name: Runner liveness

# Out-of-band check that the Dell XPS self-hosted runner can actually pick
# up jobs. Two jobs run in parallel:
#
#   * `ping` queues a 5-second no-op on [self-hosted, gpu]. It only finishes
#     if the runner is online and listening.
#   * `watcher` runs on ubuntu-latest and polls the GitHub API every 10 s
#     for the ping job's state. If `ping` stays in `queued` for more than
#     4 minutes, the runner is effectively offline and we update the sticky
#     issue.
#
# Why not just call /actions/runners directly? That endpoint requires the
# `administration:read` scope, which is NOT in the workflow GITHUB_TOKEN
# allow-list. So we infer liveness from observable job behavior instead —
# which is arguably better, because it tests end-to-end dispatch (auth +
# routing + runner pickup) rather than the runner's self-reported status.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # `actions: write` so we can both query the current workflow run's job
  # states AND cancel the still-queued ping if we detect offline.
  actions: write

concurrency:
  # Each new schedule trigger cancels any still-in-flight previous run —
  # in particular it reaps a `ping` job that's been queued forever because
  # the runner is offline.
  group: runner-liveness
  cancel-in-progress: true

jobs:
  ping:
    name: Self-hosted ping
    runs-on:
      - self-hosted
      - gpu
    timeout-minutes: 2
    steps:
      - name: Pong
        shell: bash
        run: |
          echo "pong from runner: ${RUNNER_NAME:-unknown}"
          echo "host: $(hostname)"
          echo "uname: $(uname -a)"

  watcher:
    name: Watcher (ubuntu) — verifies pickup
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Poll for ping job state
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Wait up to 4 min for `ping` to leave 'queued'. We don't need
          # it to finish — just to start, which proves dispatch worked.
          max_iters=24
          interval=10
          picked_up=false
          status=queued
          conclusion=
          for i in $(seq 1 $max_iters); do
            sleep $interval
            json=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '.jobs[] | select(.name=="Self-hosted ping")' || echo '{}')
            status=$(echo "$json" | jq -r '.status // "unknown"')
            conclusion=$(echo "$json" | jq -r '.conclusion // ""')
            echo "[$i/$max_iters] ping status=$status conclusion=$conclusion"
            if [ "$status" = "in_progress" ] || [ "$status" = "completed" ]; then
              picked_up=true
              break
            fi
          done
          {
            echo "picked_up=$picked_up"
            echo "status=$status"
            echo "conclusion=$conclusion"
          } >> "$GITHUB_OUTPUT"

      - name: Cancel hung ping job (if offline)
        if: steps.poll.outputs.picked_up == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
            || true

      - name: Report health — online (recovered)
        if: steps.poll.outputs.picked_up == 'true'
        uses: ./.github/actions/report-runner-health
        with:
          runner-name: DellXPS-wsl-gpu
          probe-name: liveness
          status: recovered

      - name: Report health — offline
        if: steps.poll.outputs.picked_up == 'false'
        uses: ./.github/actions/report-runner-health
        with:
          runner-name: DellXPS-wsl-gpu
          probe-name: liveness
          status: offline
          context: |
            The `Self-hosted ping` job stayed in `queued` for >4 minutes
            (final observed status: `${{ steps.poll.outputs.status }}`).
            That means GitHub had no online runner to dispatch to under
            the labels `[self-hosted, gpu]`.

            On-host recovery:

            ```powershell
            pwsh scripts\runners\runner-ctl.ps1 status
            pwsh scripts\runners\runner-ctl.ps1 restart
            pwsh scripts\runners\runner-ctl.ps1 watchdog status
            ```
