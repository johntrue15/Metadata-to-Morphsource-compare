name: Bootstrap nnInteractive

# One-time (or on-demand) installation of the nnInteractive Python backend
# and (optionally) the SlicerNNInteractive 3D Slicer extension on a
# self-hosted runner. Defaults to the gpu-labelled host (DellXPS-wsl-gpu);
# override via the `target_label` input.
#
# Re-running this workflow is safe — install_nninteractive.sh is idempotent
# unless `force_reinstall` is set. Also fires weekly on Monday 11:00 UTC to
# catch torch / nnInteractive package drift; the weekly probe reports its
# result to the sticky "Runner health: DellXPS-wsl-gpu" issue.

concurrency:
  group: nninteractive-bootstrap
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target_label:
        description: 'Runner label to target alongside self-hosted (default: gpu, i.e. the XPS).'
        required: false
        type: string
        default: 'gpu'
      force_reinstall:
        description: 'Wipe the existing venv and reinstall from scratch'
        required: false
        type: boolean
        default: false
      install_slicer_extension:
        description: 'Also install the SlicerNNInteractive 3D Slicer extension'
        required: false
        type: boolean
        default: true
      python_bin:
        description: 'Python interpreter to build the venv with'
        required: false
        type: string
        default: 'python3'
      torch_index_url:
        description: 'Override pip index URL for torch wheels (e.g. https://download.pytorch.org/whl/cu126)'
        required: false
        type: string
        default: ''
  schedule:
    # Mondays 11:00 UTC — catches torch / nnInteractive package drift over
    # the weekend before the work week starts. Idempotent: if everything
    # is already installed, this just verifies imports + model presence.
    - cron: '0 11 * * 1'

jobs:
  bootstrap:
    name: Bootstrap nnInteractive on self-hosted runner
    runs-on:
      - self-hosted
      - ${{ inputs.target_label || 'gpu' }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve runner-local paths
        # Each self-hosted runner advertises its layout via its own .env
        # (see docs/self-hosted-gpu-runner.md). Defaults match the Mac mini.
        shell: bash
        run: |
          ANACONDA_BIN="${ANACONDA_BIN:-/opt/anaconda3/bin}"
          SLICER_BIN="${SLICER_BIN:-/Applications/Slicer.app/Contents/MacOS/Slicer}"
          NNI_HOME="${NNINTERACTIVE_HOME:-$HOME/.autoresearchclaw/nninteractive}"
          echo "ANACONDA_BIN=$ANACONDA_BIN"      >> "$GITHUB_ENV"
          echo "SLICER_BIN=$SLICER_BIN"          >> "$GITHUB_ENV"
          echo "NNINTERACTIVE_HOME=$NNI_HOME"    >> "$GITHUB_ENV"
          echo "$ANACONDA_BIN"                   >> "$GITHUB_PATH"

      - name: Print runner info
        run: |
          echo "Host: $(hostname)"
          echo "OS:   $(uname -a)"
          echo "Python: $(${{ inputs.python_bin || 'python3' }} --version 2>&1)"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi || true
          else
            echo "No NVIDIA GPU — nnInteractive will run on CPU/MPS (slower)"
          fi

      - name: Install nnInteractive Python backend
        env:
          NNINTERACTIVE_PY: ${{ inputs.python_bin || 'python3' }}
          NNINTERACTIVE_FORCE: ${{ inputs.force_reinstall && '1' || '0' }}
          NNINTERACTIVE_TORCH_INDEX: ${{ inputs.torch_index_url }}
        run: |
          chmod +x .github/scripts/install_nninteractive.sh
          .github/scripts/install_nninteractive.sh

      - name: Print sanity report
        run: |
          echo "Venv: $NNINTERACTIVE_HOME"
          ls -la "$NNINTERACTIVE_HOME/bin" | head -20 || true
          echo "Models:"
          ls -la "$NNINTERACTIVE_HOME/models" 2>/dev/null || echo "  (none)"
          echo "Disk usage:"
          du -sh "$NNINTERACTIVE_HOME" 2>/dev/null || true

      - name: Install SlicerNNInteractive extension (optional)
        if: ${{ inputs.install_slicer_extension }}
        continue-on-error: true
        run: |
          if [ ! -x "$SLICER_BIN" ]; then
            echo "Slicer not found at $SLICER_BIN — skipping client extension install"
            exit 0
          fi
          echo "Installing SlicerNNInteractive into $SLICER_BIN..."
          "$SLICER_BIN" --no-splash --python-script \
            .github/scripts/slicer_install_nninteractive.py || true

      - name: Summary
        run: |
          echo "::notice::nnInteractive bootstrap complete."
          echo "Activate the venv with: source $NNINTERACTIVE_HOME/bin/activate"
          echo "Then run: nninteractive_loop.py --input <volume> --goal '<what to segment>'"

      - name: Detect which host ran the job
        id: whoami
        if: always()
        shell: bash
        run: |
          # The runner-health issue is keyed by runner name, so we only report
          # when the job actually landed on DellXPS-wsl-gpu. The runner exports
          # its own name via $RUNNER_NAME (set by actions-runner itself).
          echo "runner_name=${RUNNER_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Job ran on runner: ${RUNNER_NAME:-unknown}"

      - name: Collect failure context
        id: collect
        if: failure() && steps.whoami.outputs.runner_name == 'DellXPS-wsl-gpu'
        shell: bash
        run: |
          {
            echo "Bootstrap failed in [run ${{ github.run_id }}](${{ github.serverUrl }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo ""
            echo "Likely causes: torch wheel drift after a driver update, nnInteractive package upgrade breaking the venv, model weights moved/corrupted."
            echo ""
            echo "Recover by re-running with \`force_reinstall=true\`."
          } > _health_context.md
          {
            echo 'context<<HEALTH_EOF'
            cat _health_context.md
            echo 'HEALTH_EOF'
          } >> "$GITHUB_OUTPUT"

      # We report health for any run that actually executed on the XPS runner
      # (per the resolved runner_name above), whether it was triggered by the
      # weekly cron OR by a manual dispatch -- a successful manual re-run is
      # explicitly how an operator clears a stale alert after a fix.
      - name: Report health (success)
        if: success() && steps.whoami.outputs.runner_name == 'DellXPS-wsl-gpu'
        uses: ./.github/actions/report-runner-health
        with:
          runner-name: DellXPS-wsl-gpu
          probe-name: bootstrap
          status: success

      - name: Report health (failure)
        if: failure() && steps.whoami.outputs.runner_name == 'DellXPS-wsl-gpu'
        uses: ./.github/actions/report-runner-health
        with:
          runner-name: DellXPS-wsl-gpu
          probe-name: bootstrap
          status: failure
          context: ${{ steps.collect.outputs.context }}
